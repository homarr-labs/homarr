schema_version: "1.1"
name: agify-manual-lookup
expected_outcome: |
  An importable Homarr Custom JSX v2 definition built from the verified contract:
  - The answer contains exactly one fenced json code block holding the widget definition
  - The definition passes Homarr's Custom Widget v2 import schema, including JSX template validation
  - sources.default is an HTTP source at https://api.agify.io with apiKeyQuery auth named apikey
  - Defines the request: manual query GET /, query {"name":"$param:name","country_id":"$param:country"}
  - The template uses every requested capability: TextInput, SubFetch, age, count
  - The template renders with the sample load responses without a runtime error and shows "<input"
  - The template renders loading and failed request states without a runtime error
  - Because Homarr tools were unavailable, the answer adds an 'Unverified:' line naming the missing preview/persistence evidence
