schema_version: "1.1"
name: seerr-request-actions
expected_outcome: |
  An importable Homarr Custom JSX v2 definition built from the verified contract:
  - The answer contains exactly one fenced json code block holding the widget definition
  - The definition passes Homarr's Custom Widget v2 import schema, including JSX template validation
  - sources.default is an HTTP source at http://seerr.local:5055/api/v1 with apiKeyHeader auth named X-Api-Key
  - Defines the request: load query GET /request/count
  - Defines the request: load query GET /request, query {"take":"10","skip":"0","sort":"added","sortDirection":"desc"}
  - Defines the request: manual action POST /request/{param:requestId}/approve, permission modify, confirmation, invalidating /request/count and /request
  - Defines the request: manual action POST /request/{param:requestId}/decline, permission modify, confirmation, invalidating /request/count and /request
  - The template uses every requested capability: RefreshButton, ActionButton, pageInfo, results, pending, approved, available, createdAt, status4k
  - The template renders with the sample load responses without a runtime error and shows "Alex", "Sam", "42"
  - The template renders loading and failed request states without a runtime error
  - Because Homarr tools were unavailable, the answer adds an 'Unverified:' line naming the missing preview/persistence evidence
