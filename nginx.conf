events {
    worker_connections 1024;
}

http {
    ${NGINX_TRUSTED_PROXIES}
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 7575;
        ${NGINX_LISTEN_IPV6}

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Homarr-Client-IP $remote_addr;
        proxy_set_header X-Homarr-Proxy-Secret "${HOMARR_REQUEST_IDENTITY_SECRET}";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 256M;

        # Subscriptions run beside the HTTP backend in the same Bun process.
        location /websockets {
            proxy_pass http://127.0.0.1:3001;
        }

        location = /api {
            proxy_pass http://127.0.0.1:3002;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:3002;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location = /rpc {
            proxy_pass http://127.0.0.1:3002;
        }

        location /rpc/ {
            proxy_pass http://127.0.0.1:3002;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location /.well-known/ {
            proxy_pass http://127.0.0.1:3002;
        }

        location /well-known/ {
            proxy_pass http://127.0.0.1:3002;
        }

        location /auth/mcp {
            proxy_pass http://127.0.0.1:3002;
        }

        location ~ ^/[a-zA-Z-]+/auth/mcp {
            proxy_pass http://127.0.0.1:3002;
        }

        # Full images serve the dashboard; headless images use the backend here.
        location / {
            proxy_pass ${NGINX_FRONTEND_UPSTREAM};
        }
    }
}
