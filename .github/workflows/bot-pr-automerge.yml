name: "[Bots] Approve and Auto-merge"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  approve-and-automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only trusted same-repository bot PRs receive credentials. No PR code runs.
    if: |
      github.event_name != 'pull_request' ||
      (
        (github.actor_id == 158783068 || github.actor_id == 190541745 || github.actor_id == 210161987 || github.actor_id == 175441) &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'dev'
      )
    steps:
      - name: Obtain token
        id: obtainToken
        uses: actions/create-github-app-token@v3
        with:
          private-key: ${{ secrets.RENOVATE_APPROVE_PRIVATE_KEY }}
          client-id: ${{ vars.RENOVATE_APPROVE_CLIENT_ID }}
          permission-pull-requests: write

      - name: Approve and reconcile auto-merge
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.obtainToken.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            if [[ "$(gh pr view "$PR_NUMBER" --json reviewDecision --jq .reviewDecision)" != APPROVED ]]; then
              gh pr review "$PR_NUMBER" --approve --body "Automatically approved by Homarr bot policy"
            fi
            if [[ "$(gh pr view "$PR_NUMBER" --json autoMergeRequest --jq '.autoMergeRequest != null')" != true ]]; then
              gh pr merge "$PR_NUMBER" --auto --squash
            fi
          else
            gh pr list --base dev --state open --limit 100 \
              --json number,author,reviewDecision,mergeStateStatus,autoMergeRequest \
              --jq '.[] | select(.author.login as $login | ["app/homarr-renovate", "app/homarr-crowdin", "app/homarr-update-contributors", "app/homarr-releases"] | index($login)) | select(.reviewDecision == "APPROVED") | select(.mergeStateStatus == "CLEAN") | select(.autoMergeRequest == null) | .number' \
            | while read -r pr; do
                echo "Re-enabling auto-merge on PR #$pr"
                gh pr merge "$pr" --auto --squash
              done
          fi
