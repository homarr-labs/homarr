name: "[Crowdin] Upload translations"
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - "packages/translation/src/lang/**"
      - "crowdin.yml"
      - ".github/workflows/crowdin-upload.yml"
    branches: [dev]

concurrency:
  group: crowdin-sync
  cancel-in-progress: false

jobs:
  upload-crowdin-translations:
    # Don't run this action if the downloaded translations are being pushed
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(lang): updated translations from crowdin')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: false

      - name: Upload Crowdin translations
        uses: crowdin/github-action@959dc74ac104447731cba99a016f85d0ae719788 # v3.5.0
        with:
          upload_sources: true
          upload_translations: true
          download_translations: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
