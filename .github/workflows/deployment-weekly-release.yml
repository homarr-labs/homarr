name: "[Deployment] Automatic Weekly Release"

on:
  schedule:
    - cron: "0 19 * * 5" # https://crontab.guru/#0_19_*_*_5
      timezone: Europe/Zurich
  workflow_dispatch:
    inputs:
      send-notifications:
        type: boolean
        required: false
        default: true
        description: Send notifications

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    # Permissions must be set on the calling job: a reusable workflow receives
    # the default GITHUB_TOKEN permissions unless the caller job grants them here.
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/deployment-release-pr.yml
    secrets: inherit
    with:
      release-label: "Automatic release"
      title-prefix: "automatic "
      body-prefix: "**This is an automatic release**.<br/>Manual action may be required for major bumps.<br/>"
      semver-branch: dev
      head: dev
      base: main
      # Scheduled runs have no inputs, so notifications stay off unless manually dispatched.
      send-notifications: ${{ github.event.inputs.send-notifications == 'true' }}
