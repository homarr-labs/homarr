name: "[Docs] Update Contributors"

on:
  schedule:
    - cron: "0 12 * * FRI"
  workflow_dispatch:

permissions:
  contents: read

env:
  SKIP_ENV_VALIDATION: true

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # required to push the updated contributors
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev

      - name: Setup
        uses: ./tooling/github/setup

      - name: Dump contributors
        working-directory: apps/docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMARR_CROWDIN_TOKEN: ${{ secrets.HOMARR_CROWDIN_TOKEN }}
          HOMARR_LABS_CROWDIN_TOKEN: ${{ secrets.HOMARR_LABS_CROWDIN_TOKEN }}
        run: bun run api-dump-contributors

      - name: Commit updated contributors
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
        with:
          add: "apps/docs/public"
          default_author: github_actor
          message: "chore(docs): update contributors"
          push: true
