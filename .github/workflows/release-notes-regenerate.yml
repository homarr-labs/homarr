name: "[Release] Regenerate Notes"

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: Release tag to regenerate, for example v2.12.0
      dry-run:
        type: boolean
        required: false
        default: true
        description: Upload the notes as an artifact instead of editing the release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}

jobs:
  regenerate:
    name: Regenerate release notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # required for the generate-notes API and to edit the release
      pull-requests: read # required to read the merged pull requests
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs['dry-run'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Regenerate notes
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
        run: |
          notes_file="${RUNNER_TEMP}/release-notes.md"
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/release-notes/regenerate.mjs --tag "$RELEASE_TAG" --no-art --dry-run --out "$notes_file"
          else
            node scripts/release-notes/regenerate.mjs --tag "$RELEASE_TAG" --no-art --out "$notes_file"
          fi
      - name: Upload notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes-${{ inputs.tag }}
          path: ${{ runner.temp }}/release-notes.md
          retention-days: 7
