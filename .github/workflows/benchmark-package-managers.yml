name: Package manager benchmarks

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: pnpm baseline revision
        required: true
        default: 3adb63850d8fd8f9ea2b3d72db82f4591f950e41
      candidate:
        description: Bun candidate revision (empty uses the selected workflow revision)
        required: false
      production:
        description: Also benchmark production builds and dashboard runtime
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASELINE_REF: ${{ inputs.baseline }}
      CANDIDATE_REF: ${{ inputs.candidate || github.sha }}
    steps:
      - uses: actions/checkout@v7
        if: "!env.ACT"
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install pinned baseline package manager
        working-directory: ${{ runner.temp }}
        run: npm install --prefix "$RUNNER_TEMP/benchmark-tools" --ignore-scripts --no-audit --no-fund pnpm@11.15.1
      - name: Measure installs, cache restoration, workspaces, and merge conflicts
        run: |
          python3 scripts/benchmarks/package-managers.py \
            --base "$BASELINE_REF" --head "$CANDIDATE_REF" \
            --node "$(command -v node)" --bun "$(command -v bun)" \
            --pnpm "$RUNNER_TEMP/benchmark-tools/node_modules/pnpm/bin/pnpm.cjs" \
            --work-dir "$RUNNER_TEMP/package-manager-comparison" \
            --output benchmark-results/bun-migration
      - name: Add benchmark summary
        if: always()
        run: |
          if test -f benchmark-results/bun-migration/package-managers.json; then
            python3 scripts/benchmarks/summarize-package-managers.py \
              benchmark-results/bun-migration/package-managers.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve measurements and failures
        if: always() && !env.ACT
        uses: actions/upload-artifact@v7
        with:
          name: package-manager-benchmarks-${{ github.run_id }}
          path: benchmark-results/bun-migration/
          if-no-files-found: error

  production:
    if: inputs.production
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      BASELINE_REF: ${{ inputs.baseline }}
      CANDIDATE_REF: ${{ inputs.candidate || github.sha }}
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        if: "!env.ACT"
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tooling/github/setup
      - name: Install benchmark browser
        run: bun x --bun playwright install --with-deps chromium
      - name: Create isolated production worktrees
        run: |
          git clone --shared --no-checkout "$GITHUB_WORKSPACE" "$RUNNER_TEMP/production-repository"
          git -C "$RUNNER_TEMP/production-repository" worktree add --detach "$RUNNER_TEMP/homarr-baseline" "$BASELINE_REF"
          git -C "$RUNNER_TEMP/production-repository" worktree add --detach "$RUNNER_TEMP/homarr-candidate" "$CANDIDATE_REF"
      - name: Measure balanced builds and dashboard workloads
        run: |
          python3 scripts/benchmarks/production-migration.py \
            --baseline "$RUNNER_TEMP/homarr-baseline" \
            --candidate "$RUNNER_TEMP/homarr-candidate" \
            --bun "$(command -v bun)" \
            --output benchmark-results/production-migration \
            --builder-prefix "homarr-benchmark-${{ github.run_id }}"
      - name: Preserve production measurements and failures
        if: always() && !env.ACT
        uses: actions/upload-artifact@v7
        with:
          name: production-benchmarks-${{ github.run_id }}
          path: benchmark-results/production-migration/
          if-no-files-found: error
