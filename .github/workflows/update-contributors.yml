name: Update Contributors

on:
  schedule:
    - cron: "0 12 * * FRI"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-contributors
  cancel-in-progress: false

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtain token
        id: obtainToken
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          private-key: ${{ secrets.HOMARR_UPDATE_CONTRIBUTORS_PRIVATE_KEY }}
          client-id: ${{ vars.HOMARR_UPDATE_CONTRIBUTORS_CLIENT_ID }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dev
          persist-credentials: false
      - name: Setup
        uses: ./tooling/github/setup

      - name: Update application contributors
        run: bun ./scripts/update-contributors.mjs
        env:
          GITHUB_TOKEN: ${{ steps.obtainToken.outputs.token }}
          CROWDIN_TOKEN: ${{ secrets.CROWDIN_UPDATE_CONTRIBUTORS_TOKEN }}

      - name: Update documentation contributors
        working-directory: apps/docs
        run: bun run api-dump-contributors
        env:
          GITHUB_TOKEN: ${{ steps.obtainToken.outputs.token }}
          HOMARR_CROWDIN_TOKEN: ${{ secrets.HOMARR_CROWDIN_TOKEN }}
          HOMARR_LABS_CROWDIN_TOKEN: ${{ secrets.HOMARR_LABS_CROWDIN_TOKEN }}

      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.obtainToken.outputs.token }}
          add-paths: |
            static-data/
            apps/docs/public/data/
          branch: update-contributors
          base: dev
          commit-message: "chore: update contributors"
          author: Homarr Update Contributors <210161987+homarr-update-contributors[bot]@users.noreply.github.com>
          title: "chore: update contributors"
          delete-branch: true
          body: Updates application and documentation contributor data.

      - name: Enable auto-merge
        if: steps.create-pull-request.outputs.pull-request-number != ''
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.obtainToken.outputs.token }}
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash
