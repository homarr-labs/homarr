name: Workshop

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/workshop.yml"
      - "tooling/github/plan-workshop.mjs"
      - "tooling/github/docker-build.sh"
      - "apps/workshop/**"
      - "packages/workshop/**"
      - "apps/docs/src/components/workshop/**"
      - "apps/docs/src/app/(home)/workshop/**"
      - "apps/docs/src/lib/workshop*"
      - "apps/docs/public/workshop-runtime-config.js"
      - "!**/*.md"
      - "!**/*.mdx"
  push:
    branches: [dev]
    paths:
      - ".github/workflows/workshop.yml"
      - "tooling/github/plan-workshop.mjs"
      - ".dockerignore"
      - "tooling/github/docker-build.sh"
      - "apps/workshop/**"
      - "apps/docs/**"
      - "tools/motion-reel/three/**"
      - "packages/common/**"
      - "packages/core/**"
      - "packages/custom-widgets/**"
      - "packages/definitions/**"
      - "packages/db/**"
      - "packages/server-settings/**"
      - "packages/settings/**"
      - "packages/translation/**"
      - "packages/ui/**"
      - "packages/validation/**"
      - "packages/workshop/**"
      - "tooling/typescript/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - "!packages/**/*.spec.ts"
      - "!packages/**/*.spec.tsx"
      - "!packages/**/*.test.ts"
      - "!packages/**/*.test.tsx"
      - "!packages/**/__tests__/**"
      - "!packages/**/*.md"
      - "!packages/db/migrations/seed.ts"
  # Semantic Release advances main with its version commit. Publish afterwards.
  workflow_run:
    workflows: ["[Deployment] Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: Select build and publication
        id: plan
        run: node tooling/github/plan-workshop.mjs

  production-smoke:
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.publish != 'true'
    name: Production image smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        if: "!env.ACT"
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: Set up Docker Buildx
        if: "!env.ACT"
        uses: docker/setup-buildx-action@v4
      - name: Build the production image
        if: "!env.ACT"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/workshop/Dockerfile
          target: production
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: homarr-workshop:smoke
          cache-from: type=gha,scope=workshop-linux-${{ matrix.arch }}
          cache-to: type=gha,scope=workshop-linux-${{ matrix.arch }},mode=max
          secrets: |
            TURBO_API=${{ secrets.TURBO_API }}
            TURBO_TEAM=${{ secrets.TURBO_TEAM }}
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_REMOTE_CACHE_SIGNATURE_KEY=${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      - name: Exercise the production image
        if: "!env.ACT"
        env:
          WORKSHOP_IMAGE_TEST_IMAGE: homarr-workshop:smoke
        run: sh apps/workshop/test-image.sh
      - name: Build and exercise the production image with Act
        if: env.ACT
        env:
          TURBO_API: ${{ secrets.TURBO_API }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
        run: sh apps/workshop/test-image.sh

  validate:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        if: "!env.ACT"
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
      - run: docker compose --env-file apps/workshop/.env.staging.example -f apps/workshop/docker-compose.staging.yml config --quiet

  publish-amd64:
    if: needs.plan.outputs.publish == 'true'
    needs: [plan, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        if: "!env.ACT"
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: apps/workshop/Dockerfile
          target: production
          platforms: linux/amd64
          labels: org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
          outputs: type=image,"name=ghcr.io/homarr-labs/workshop",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=workshop-linux-amd64
          cache-to: type=gha,scope=workshop-linux-amd64,mode=max
          secrets: |
            TURBO_API=${{ secrets.TURBO_API }}
            TURBO_TEAM=${{ secrets.TURBO_TEAM }}
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_REMOTE_CACHE_SIGNATURE_KEY=${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      - name: Exercise the candidate image
        env:
          WORKSHOP_IMAGE_TEST_IMAGE: ghcr.io/homarr-labs/workshop@${{ steps.build.outputs.digest }}
        run: sh apps/workshop/test-image.sh

  publish-arm64:
    if: needs.plan.outputs.publish == 'true'
    needs: [plan, validate]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        if: "!env.ACT"
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: apps/workshop/Dockerfile
          target: production
          platforms: linux/arm64
          labels: org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
          outputs: type=image,"name=ghcr.io/homarr-labs/workshop",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=workshop-linux-arm64
          cache-to: type=gha,scope=workshop-linux-arm64,mode=max
          secrets: |
            TURBO_API=${{ secrets.TURBO_API }}
            TURBO_TEAM=${{ secrets.TURBO_TEAM }}
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_REMOTE_CACHE_SIGNATURE_KEY=${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      - name: Exercise the candidate image
        env:
          WORKSHOP_IMAGE_TEST_IMAGE: ghcr.io/homarr-labs/workshop@${{ steps.build.outputs.digest }}
        run: sh apps/workshop/test-image.sh

  publish:
    if: needs.plan.outputs.publish == 'true'
    needs: [plan, publish-amd64, publish-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      pull-requests: read
    env:
      WORKSHOP_IMAGE: ghcr.io/homarr-labs/workshop
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify source before publication
        uses: actions/github-script@v8
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            if (context.eventName === "pull_request") {
              const { data: pull } = await github.rest.pulls.get({
                ...context.repo, pull_number: context.payload.pull_request.number,
              });
              if (pull.state !== "open" || pull.draft || pull.head.sha !== process.env.EXPECTED_PR_HEAD) {
                core.setFailed("PR closed, became a draft, or changed while building; refusing stale publication.");
              }
              return;
            }
            let branchName = context.ref.replace("refs/heads/", "");
            if (context.eventName === "workflow_run") branchName = "main";
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: branchName });
            if (branch.commit.sha !== process.env.EXPECTED_SHA) {
              core.setFailed("Branch changed while building; refusing stale publication.");
            }
      - name: Publish multi-platform image
        env:
          AMD64_DIGEST: ${{ needs.publish-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.publish-arm64.outputs.digest }}
          IMAGE_TAGS: ${{ needs.plan.outputs.tags }}
        run: |
          tags=()
          for tag in $IMAGE_TAGS; do tags+=(-t "${WORKSHOP_IMAGE}:$tag"); done
          docker buildx imagetools create "${tags[@]}" \
            "${WORKSHOP_IMAGE}@${AMD64_DIGEST}" \
            "${WORKSHOP_IMAGE}@${ARM64_DIGEST}"
      - name: Verify every published tag
        env:
          IMAGE_TAGS: ${{ needs.plan.outputs.tags }}
        run: |
          expected_digest=""
          for tag in $IMAGE_TAGS; do
            image="${WORKSHOP_IMAGE}:$tag"
            manifest="$(docker buildx imagetools inspect "$image" --raw)"
            for architecture in amd64 arm64; do
              jq --exit-status --arg architecture "$architecture" \
                'any(.manifests[]; .platform.os == "linux" and .platform.architecture == $architecture)' \
                <<<"$manifest" >/dev/null
            done
            digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
            if [[ -n "$expected_digest" ]]; then test "$digest" = "$expected_digest"; fi
            expected_digest="$digest"
          done
