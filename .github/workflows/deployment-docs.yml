name: "[Deployment] Documentation"

on:
  push:
    branches: ["dev"]
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "tooling/**"
      - "tools/motion-reel/three/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - ".github/workflows/deployment-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  SKIP_ENV_VALIDATION: true
  TURBO_API: ${{ secrets.TURBO_API }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup
        uses: ./tooling/github/setup
        with:
          next-cache: "docs"
          turbo-cache: "true"
      - name: Build docs
        run: bun run turbo run build --filter=@homarr/docs
        env:
          CI: "true"
      - name: Validate exported links and search
        run: |
          bun run --filter @homarr/docs validate:links
          bun run --filter @homarr/docs verify:search
          bun run --filter @homarr/docs verify:seo
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "apps/docs/out"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
