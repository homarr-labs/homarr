name: Regression contracts

on:
  workflow_call:
    inputs:
      ref:
        description: Revision to validate
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: Revision to validate (defaults to selected branch)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  contracts:
    name: External services and critical flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: ./tooling/github/setup
      - name: Install local Redis
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-server
      - name: Verify production contracts
        run: pnpm test
      - name: Upload repeatable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/tests/
          if-no-files-found: warn
          retention-days: 14

  # Preserve the existing required-check identity while replacing its suite.
  database-gate:
    name: Database gate
    needs: contracts
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require regression contracts
        env:
          CONTRACTS: ${{ needs.contracts.result }}
        run: test "$CONTRACTS" = success
