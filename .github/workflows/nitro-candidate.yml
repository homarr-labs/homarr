name: Nitro candidate preparation

on:
  workflow_dispatch:
    inputs:
      activation:
        description: Enter accepted only after the frozen production closure is approved
        type: string
        required: true
        default: held

permissions:
  contents: read

jobs:
  candidate:
    if: inputs.activation == 'accepted'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build candidate without publication or startup
        uses: docker/build-push-action@v7
        with:
          context: .
          target: nitro-candidate
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/nitro-candidate-${{ matrix.architecture }}.tar
          build-args: HOMARR_NITRO_ACTIVATION=accepted
      - uses: actions/upload-artifact@v7
        with:
          name: nitro-candidate-${{ matrix.architecture }}
          path: ${{ runner.temp }}/nitro-candidate-${{ matrix.architecture }}.tar
          retention-days: 7
