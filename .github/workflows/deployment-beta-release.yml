name: "[Deployment] Beta Release"

on:
  workflow_dispatch:
    inputs:
      send-notifications:
        type: boolean
        required: false
        default: true
        description: Send notifications

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    # Permissions must be set on the calling job: a reusable workflow receives
    # the default GITHUB_TOKEN permissions unless the caller job grants them here.
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/deployment-release-pr.yml
    secrets: inherit
    with:
      release-label: "Beta release"
      version-suffix: "-beta"
      semver-branch: next
      head: next
      base: beta
      send-notifications: ${{ github.event.inputs.send-notifications == 'true' }}
