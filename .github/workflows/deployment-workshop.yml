name: "[Deployment] Workshop"

on:
  push:
    branches: ["dev"]
    paths:
      - "apps/docs/**"
      - "apps/workshop/**"
      - "packages/definitions/src/docs/**"
      - "packages/validation/**"
      - "packages/workshop/**"
      - "patches/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deployment-workshop.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: workshop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and publish Workshop
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/workshop/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/homarr-labs/workshop:dev
            ghcr.io/homarr-labs/workshop:sha-${{ github.sha }}
          cache-from: type=gha,scope=workshop
          cache-to: type=gha,mode=max,scope=workshop
