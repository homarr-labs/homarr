name: "[Bots] Reconcile Auto-merge"

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtain token
        id: obtainToken
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          private-key: ${{ secrets.RENOVATE_APPROVE_PRIVATE_KEY }}
          client-id: ${{ vars.RENOVATE_APPROVE_CLIENT_ID }}
          permission-pull-requests: write # required to enable auto-merge

      - name: Re-enable auto-merge for prepared bot PRs
        env:
          GITHUB_TOKEN: ${{ steps.obtainToken.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 158783068: homarr-renovate[bot]
          # 190541745: homarr-crowdin[bot]
          # 210161987: homarr-update-contributors[bot]
          # 175441: homarr-releases[bot]
          gh pr list --repo "$GH_REPO" --base dev --state open --limit 100 \
            --json number,author,body,reviewDecision,mergeStateStatus,autoMergeRequest \
            --jq '.[] | select(.author.login as $login | ["app/homarr-renovate", "app/homarr-crowdin", "app/homarr-update-contributors", "app/homarr-releases"] | index($login)) | select(.author.login != "app/homarr-renovate" or (.body | contains("**Automerge**: Enabled"))) | select(.reviewDecision == "APPROVED") | select(.mergeStateStatus == "CLEAN") | select(.autoMergeRequest == null) | .number' \
          | while read -r pr; do
              echo "Re-enabling auto-merge on PR #$pr"
              gh pr merge "$pr" --auto --squash
            done
          gh pr list --repo "$GH_REPO" --base dev --state open --author app/homarr-renovate --limit 100 \
            --json number,body,autoMergeRequest \
            --jq '.[] | select(.body | contains("**Automerge**: Enabled") | not) | select(.autoMergeRequest != null) | .number' \
          | while read -r pr; do
              echo "Disabling auto-merge on manual-review Renovate PR #$pr"
              gh pr merge "$pr" --disable-auto
            done
