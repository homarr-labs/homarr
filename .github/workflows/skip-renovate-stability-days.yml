permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  skip-stability-days:
    if: ${{ !startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Skip Stability Days
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      statuses: write
    steps:
      - name: Add status check
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              -f 'state=success' \
              -f 'target_url=https://docs.renovatebot.com/configuration-options#minimumreleaseage' \
              -f 'description=Skipped for non renovate branches' \
              -f 'context=renovate/stability-days' \
              --silent; then
              exit 0
            fi
            echo "status POST failed (attempt $attempt/5), retrying in 5s"
            sleep 5
          done
          exit 1
