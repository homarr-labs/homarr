name: Prebuilt SQLite binding
description: Provides a native SQLite binding for the archive's target libc
inputs:
  architecture:
    description: Native architecture (amd64 or arm64)
    required: true
  libc:
    description: Target libc distribution (debian or alpine)
    default: debian
outputs:
  path:
    description: Path to the native binding
    value: ${{ runner.temp }}/prebuilts/${{ inputs.libc }}
runs:
  using: composite
  steps:
    - name: Select native build images
      id: images
      shell: bash
      env:
        LIBC: ${{ inputs.libc }}
      run: |
        case "$LIBC" in
          debian)
            echo 'node=node:24.18.0-trixie-slim' >> "$GITHUB_OUTPUT"
            echo 'bun=oven/bun:1.4.3-debian' >> "$GITHUB_OUTPUT"
            ;;
          alpine)
            echo 'node=node:24.18.0-alpine' >> "$GITHUB_OUTPUT"
            echo 'bun=oven/bun:1.4.3-alpine' >> "$GITHUB_OUTPUT"
            ;;
          *) echo "Unsupported libc: $LIBC" >&2; exit 1 ;;
        esac
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build the native binding
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        push: false
        load: true
        context: ./deployments/prebuilt-debian
        platforms: linux/${{ inputs.architecture }}
        build-args: |
          NODE_IMAGE=${{ steps.images.outputs.node }}
          BUN_IMAGE=${{ steps.images.outputs.bun }}
        tags: homarr-prebuilt-${{ inputs.architecture }}-${{ inputs.libc }}
        cache-from: type=gha,scope=homarr-prebuilt-${{ inputs.architecture }}-${{ inputs.libc }}
        cache-to: type=gha,scope=homarr-prebuilt-${{ inputs.architecture }}-${{ inputs.libc }},mode=max
    - name: Extract the native binding
      shell: bash
      env:
        ARCHITECTURE: ${{ inputs.architecture }}
        LIBC: ${{ inputs.libc }}
      run: |
        container="homarr-prebuilt-${ARCHITECTURE}-${LIBC}"
        trap 'docker rm -f "$container" >/dev/null' EXIT
        docker create --name "$container" "$container" node --version >/dev/null
        mkdir -p "$RUNNER_TEMP/prebuilts/$LIBC"
        docker cp "$container:/app/node_modules/better-sqlite3/build/Release/better_sqlite3.node" \
          "$RUNNER_TEMP/prebuilts/$LIBC/better_sqlite3.node"
