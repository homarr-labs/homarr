name: Extract Build Artifact
description: Extracts and validates native Debian and Alpine release archives
inputs:
  digest:
    description: Digest of Docker image to use
    required: true
  architecture:
    description: Native architecture (amd64 or arm64)
    required: true
  release-tag:
    description: Tag of the release to which the artifact will be attached
    required: true
  repository:
    description: Repository to which the release belongs, e.g. owner/repo
    required: true
  token:
    description: GitHub token with permissions to upload release assets
    required: true
  upload:
    description: Upload validated archives to the release
    default: "true"
runs:
  using: composite
  steps:
    - name: Extract the application and identify its native platform
      id: extraction
      shell: bash
      env:
        IMAGE: ${{ inputs.digest }}
        ARCHITECTURE: ${{ inputs.architecture }}
      run: |
        case "$ARCHITECTURE" in amd64|arm64) ;; *) exit 1 ;; esac
        platform="$(docker run --rm --platform "linux/$ARCHITECTURE" --entrypoint node "$IMAGE" -e '
          const arch = { x64: "amd64", arm64: "arm64" }[process.arch];
          let libc = "alpine";
          if (process.report.getReport().header.glibcVersionRuntime) libc = "debian";
          console.log(`${arch} ${libc}`);
        ')"
        read -r actual_arch source_libc <<< "$platform"
        test "$actual_arch" = "$ARCHITECTURE"
        case "$source_libc" in
          debian) compatibility_libc=alpine ;;
          alpine) compatibility_libc=debian ;;
          *) exit 1 ;;
        esac
        archive_dir="$(mktemp -d "$RUNNER_TEMP/homarr-archive-${ARCHITECTURE}.XXXXXX")"
        mkdir "$archive_dir/source"
        container="homarr-extraction-${ARCHITECTURE}"
        trap 'docker rm -f -v "$container" >/dev/null' EXIT
        docker create --name "$container" --entrypoint node "$IMAGE" --version >/dev/null
        docker cp "$container:/app/." "$archive_dir/source/"
        docker cp "$container:/etc/nginx/templates/nginx.conf" "$archive_dir/source/nginx.conf"
        printf 'path=%s\nsource-libc=%s\ncompatibility-libc=%s\n' \
          "$archive_dir" "$source_libc" "$compatibility_libc" >> "$GITHUB_OUTPUT"

    - name: Build the opposite-libc SQLite binding
      uses: ./.github/actions/prebuilt-debian
      id: prebuilt
      with:
        architecture: ${{ inputs.architecture }}
        libc: ${{ steps.extraction.outputs.compatibility-libc }}

    - name: Create both release archives
      shell: bash
      env:
        ARCHIVE_DIR: ${{ steps.extraction.outputs.path }}
        ARCHITECTURE: ${{ inputs.architecture }}
        SOURCE_LIBC: ${{ steps.extraction.outputs.source-libc }}
        COMPATIBILITY_LIBC: ${{ steps.extraction.outputs.compatibility-libc }}
        PREBUILT_PATH: ${{ steps.prebuilt.outputs.path }}
      run: |
        tar --owner=0 --group=0 -czf "$ARCHIVE_DIR/build-${SOURCE_LIBC}-${ARCHITECTURE}.tar.gz" -C "$ARCHIVE_DIR/source" .
        cp "$PREBUILT_PATH/better_sqlite3.node" "$ARCHIVE_DIR/source/build/better_sqlite3.node"
        cp "$PREBUILT_PATH/better_sqlite3.node" "$ARCHIVE_DIR/source/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
        tar --owner=0 --group=0 -czf "$ARCHIVE_DIR/build-${COMPATIBILITY_LIBC}-${ARCHITECTURE}.tar.gz" -C "$ARCHIVE_DIR/source" .

    - name: Validate both archives on their target libc and architecture
      shell: bash
      env:
        ARCHIVE_DIR: ${{ steps.extraction.outputs.path }}
        ARCHITECTURE: ${{ inputs.architecture }}
      run: |
        for distribution in debian alpine; do
          node_image=node:24.18.0-trixie-slim
          if [[ "$distribution" = alpine ]]; then node_image=node:24.18.0-alpine; fi
          docker run --rm --platform "linux/$ARCHITECTURE" \
            --mount "type=bind,src=$ARCHIVE_DIR,dst=/archives,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.github/actions/extract-build-artifact/validate-native.cjs,dst=/validate-native.cjs,readonly" \
            "$node_image" sh -ec '
              mkdir /tmp/archive
              tar -xzf "/archives/build-$1-$2.tar.gz" -C /tmp/archive
              cd /tmp/archive
              node /validate-native.cjs "$1" "$2"
            ' sh "$distribution" "$ARCHITECTURE"
        done

    - name: Upload both validated archives
      if: inputs.upload == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ inputs.repository }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        ARCHIVE_DIR: ${{ steps.extraction.outputs.path }}
        ARCHITECTURE: ${{ inputs.architecture }}
      run: |
        gh release upload "$RELEASE_TAG" \
          "$ARCHIVE_DIR/build-alpine-${ARCHITECTURE}.tar.gz" \
          "$ARCHIVE_DIR/build-debian-${ARCHITECTURE}.tar.gz" --clobber
