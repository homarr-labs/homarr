# Include inside the existing homarr.dev TLS server. Keep its existing website
# fallback and PocketBase /api routes: Workshop OAuth uses /api/oauth2-redirect.
location = /remote {
    proxy_pass http://127.0.0.1:3104;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ^~ /remote/ {
    proxy_pass http://127.0.0.1:3104;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Optional, only when the Compose relay profile is enabled. The trailing slash
# on proxy_pass strips /relay/ so /relay/workers/<id> reaches /workers/<id>.
location = /relay {
    return 308 /relay/;
}

location ^~ /relay/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    # Exceed Bun's 120-second WebSocket heartbeat window.
    proxy_read_timeout 300s;
}
