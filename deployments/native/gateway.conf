server {
    listen 80;
    server_name _;
    client_max_body_size 256M;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;

    location = /native-health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /.well-known/oauth-authorization-server/platform/mcp {
        proxy_pass http://platform:3104/platform/.well-known/oauth-authorization-server;
    }

    location = /.well-known/oauth-protected-resource/platform/mcp {
        proxy_pass http://platform:3104/platform/.well-known/oauth-protected-resource/mcp;
    }

    location = /platform {
        proxy_pass http://platform:3104;
    }

    location ^~ /platform/ {
        proxy_pass http://platform:3104;
        proxy_buffering off;
    }

    location ^~ /relay/ {
        proxy_pass http://relay:8787/;
        proxy_buffering off;
    }

    location = /workers/primary {
        proxy_pass http://worker-primary:3002/;
        proxy_buffering off;
    }

    location ^~ /workers/primary/ {
        proxy_pass http://worker-primary:3002/;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_buffering off;
    }
}
