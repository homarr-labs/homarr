const canvas=document.getElementById('confetti'),ctx=canvas.getContext('2d');
const rand=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const colors=['#ff779d','#ffdd77','#a1ffcc','#8feaff','#c3a5ff','#ffffff'];
function draw(t){ctx.clearRect(0,0,1920,1080);for(let i=0;i<640;i++){let x,y;const r=rand(i+1),q=rand(i+911);if(i<360){x=r*2100-90+Math.sin(t*2+i)*55;y=((q*2100+t*(190+rand(i+22)*180))%1800)-450;}else{const side=i%2;const a=(t%4.8)-(i%3)*.36;const u=Math.max(0,a);const origin=side*1920;const speed=450+rand(i+13)*520;x=origin+(1-side*2)*speed*u;y=1070-(780+q*340)*u+240*u*u;if(a<0)continue;}ctx.save();ctx.translate(x,y);ctx.rotate(i+t*(2+r*5));ctx.fillStyle=colors[i%colors.length];ctx.globalAlpha=.85;ctx.fillRect(-5,-8,7+q*8,10+r*14);ctx.restore();}}
const clock={t:0};draw(0);tl.to(clock,{t:13,duration:13,ease:'none',onUpdate:()=>draw(clock.t)},0);
tl.fromTo('.ending-logo',{scale:.92},{scale:1,duration:.65,ease:'back.out(1.4)'},0);

tl.fromTo('.progress',{scaleX:0},{scaleX:1,duration:13,ease:'none'},0);window.__timelines['ending']=tl;</script></body></html>
