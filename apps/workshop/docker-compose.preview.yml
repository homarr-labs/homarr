name: homarr-workshop

services:
  workshop:
    build:
      context: ../..
      dockerfile: apps/workshop/Dockerfile
      target: production
      args:
        POCKETBASE_VERSION: 0.39.6
    restart: unless-stopped
    environment:
      PB_ALLOWED_ORIGINS: ${PB_ALLOWED_ORIGINS:-*}
    ports:
      - "127.0.0.1:${PB_EXPOSE_PORT:-8090}:8090"
    volumes:
      - ${WORKSHOP_DATA_DIR:-./pb_data}:/pb_data
    security_opt:
      - no-new-privileges:true
