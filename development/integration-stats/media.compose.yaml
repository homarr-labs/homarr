name: homarr-stats-live

services:
  media-maintainerr:
    image: maintainerr/maintainerr:latest
    ports: ["127.0.0.1:23111:6246"]
    environment: { TZ: UTC }
    volumes: [media-maintainerr:/opt/data]

  media-fileflows:
    image: revenz/fileflows:latest
    ports: ["127.0.0.1:23112:5000"]
    environment: { TZ: UTC, DOTNET_USE_POLLING_FILE_WATCHER: "1" }
    volumes: [media-fileflows:/app]

  media-plantit-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: bootdb
      MYSQL_ROOT_PASSWORD: ${MEDIA_PLANTIT_DB_PASSWORD:?set MEDIA_PLANTIT_DB_PASSWORD}
    volumes: [media-plantit-mysql-db:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
  media-plantit-cache:
    image: redis:7-alpine
  media-plantit:
    image: msdeluise/plant-it-server:latest
    depends_on:
      media-plantit-db: { condition: service_healthy }
      media-plantit-cache: { condition: service_started }
    ports: ["127.0.0.1:23113:8080"]
    environment:
      MYSQL_HOST: media-plantit-db
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PSW: ${MEDIA_PLANTIT_DB_PASSWORD:?set MEDIA_PLANTIT_DB_PASSWORD}
      MYSQL_DATABASE: bootdb
      MYSQL_ROOT_PASSWORD: ${MEDIA_PLANTIT_DB_PASSWORD:?set MEDIA_PLANTIT_DB_PASSWORD}
      JWT_SECRET: ${MEDIA_PLANTIT_JWT_SECRET:?set MEDIA_PLANTIT_JWT_SECRET}
      API_PORT: 8080
      UPLOAD_DIR: /upload-dir
      CACHE_HOST: media-plantit-cache
      CACHE_PORT: 6379
    volumes: [media-plantit-upload:/upload-dir, media-plantit-certs:/certificates]

  media-stash:
    image: stashapp/stash:latest
    ports: ["127.0.0.1:23114:9999"]
    environment:
      STASH_STASH: /data/
      STASH_GENERATED: /generated/
      STASH_METADATA: /metadata/
      STASH_CACHE: /cache/
      STASH_PORT: 9999
    volumes:
      - media-stash-config:/root/.stash
      - media-stash-data:/data
      - media-stash-generated:/generated
      - media-stash-metadata:/metadata
      - media-stash-cache:/cache
      - media-stash-blobs:/blobs
      - media-stash-plugins:/plugins
      - media-stash-scrapers:/scrapers

  media-unmanic:
    image: josh5/unmanic:latest
    ports: ["127.0.0.1:23115:8888"]
    environment: { PUID: 1000, PGID: 1000, TZ: UTC }
    volumes:
      - media-unmanic-config:/config
      - media-unmanic-library:/library
      - media-unmanic-cache:/tmp/unmanic

  media-xteve:
    image: alturismo/xteve:latest
    ports: ["127.0.0.1:23116:34400"]
    volumes: [media-xteve:/root/.xteve]

  media-romm-db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MEDIA_ROMM_DB_ROOT_PASSWORD:?set MEDIA_ROMM_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: romm
      MARIADB_USER: romm
      MARIADB_PASSWORD: ${MEDIA_ROMM_DB_PASSWORD:?set MEDIA_ROMM_DB_PASSWORD}
    volumes: [media-romm-db:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
  media-romm-cache:
    image: redis:7-alpine
  media-romm:
    image: ghcr.io/rommapp/romm:latest
    depends_on:
      media-romm-db: { condition: service_healthy }
      media-romm-cache: { condition: service_started }
    ports: ["127.0.0.1:23117:8080"]
    environment:
      DB_HOST: media-romm-db
      DB_NAME: romm
      DB_USER: romm
      DB_PASSWD: ${MEDIA_ROMM_DB_PASSWORD:?set MEDIA_ROMM_DB_PASSWORD}
      DB_PORT: 3306
      REDIS_HOST: media-romm-cache
      ROMM_AUTH_SECRET_KEY: ${MEDIA_ROMM_AUTH_SECRET:?set MEDIA_ROMM_AUTH_SECRET}
      ROMM_BASE_PATH: /app/romm
      IGDB_CLIENT_ID: ""
      IGDB_CLIENT_SECRET: ""
    volumes:
      - media-romm-assets:/romm/assets
      - media-romm-resources:/romm/resources
      - media-romm-library:/romm/library
      - media-romm-config:/romm/config

  media-yourspotify-db:
    image: mongo:8
    volumes: [media-yourspotify-db:/data/db]
  media-yourspotify:
    image: yooooomi/your_spotify_server:latest
    depends_on: { media-yourspotify-db: { condition: service_started } }
    ports: ["127.0.0.1:23118:8080"]
    environment:
      MONGO_ENDPOINT: mongodb://media-yourspotify-db:27017/your_spotify
      API_ENDPOINT: http://127.0.0.1:23118
      CLIENT_ENDPOINT: http://127.0.0.1:23119
      SPOTIFY_PUBLIC: ""
      SPOTIFY_SECRET: ""
      CORS: http://127.0.0.1:23119

volumes:
  media-maintainerr: {}
  media-fileflows: {}
  media-plantit-mysql-db: {}
  media-plantit-upload: {}
  media-plantit-certs: {}
  media-stash-config: {}
  media-stash-data: {}
  media-stash-generated: {}
  media-stash-metadata: {}
  media-stash-cache: {}
  media-stash-blobs: {}
  media-stash-plugins: {}
  media-stash-scrapers: {}
  media-unmanic-config: {}
  media-unmanic-library: {}
  media-unmanic-cache: {}
  media-xteve: {}
  media-romm-db: {}
  media-romm-assets: {}
  media-romm-resources: {}
  media-romm-library: {}
  media-romm-config: {}
  media-yourspotify-db: {}
