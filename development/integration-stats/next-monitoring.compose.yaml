name: homarr-stats-live
services:
  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    ports: ["127.0.0.1:23211:8080"]
    volumes:
      - ${NEXT_MONITORING_DATA_ROOT:-/tmp/homarr-stats-live/next-monitoring/data}/scrutiny:/opt/scrutiny/config
      - ${NEXT_MONITORING_DATA_ROOT:-/tmp/homarr-stats-live/next-monitoring/data}/scrutiny/influxdb:/opt/scrutiny/influxdb
    networks: [stats]
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.15.2
    ports: ["127.0.0.1:23212:5000"]
    shm_size: "128mb"
    volumes:
      - ${NEXT_MONITORING_DATA_ROOT:-/tmp/homarr-stats-live/next-monitoring/data}/frigate:/config
      - ./next-monitoring/frigate/config.yml:/config/config.yml:ro
      - ${NEXT_MONITORING_DATA_ROOT:-/tmp/homarr-stats-live/next-monitoring/data}/frigate/media:/media/frigate
    networks: [stats]
  netalertx:
    image: jokobsk/netalertx:26.8.5
    # Backend-only fixture: this host rejects PHP-FPM config reads in the stock image.
    entrypoint: ["python3", "-m", "server"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 20212), 3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports: ["127.0.0.1:23213:20212"]
    environment:
      PUID: "0"
      PGID: "0"
      NETALERTX_UID: "0"
      NETALERTX_GID: "0"
      LISTEN_ADDR: "0.0.0.0"
      PORT: "20211"
      SCAN_ON_START: "false"
      NETWORK_SCAN_ENABLED: "false"
    cap_add: [NET_RAW, NET_ADMIN, NET_BIND_SERVICE]
    volumes:
      - ${NEXT_MONITORING_DATA_ROOT:-/tmp/homarr-stats-live/next-monitoring/data}/netalertx:/data
    networks: [stats]
networks:
  stats:
    name: homarr-stats-live
