name: homarr-stats-live
services:
  next-arr-sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    ports: ["127.0.0.1:23231:8989"]
    environment: { PUID: "1000", PGID: "1000", TZ: UTC }
    volumes:
      - ${NEXT_ARR_DATA_ROOT:?set NEXT_ARR_DATA_ROOT}/sonarr/config:/config
      - ${NEXT_ARR_DATA_ROOT:?set NEXT_ARR_DATA_ROOT}/sonarr/media:/tv
  next-arr-radarr:
    image: lscr.io/linuxserver/radarr:latest
    ports: ["127.0.0.1:23232:7878"]
    environment: { PUID: "1000", PGID: "1000", TZ: UTC }
    volumes:
      - ${NEXT_ARR_DATA_ROOT:?set NEXT_ARR_DATA_ROOT}/radarr/config:/config
      - ${NEXT_ARR_DATA_ROOT:?set NEXT_ARR_DATA_ROOT}/radarr/media:/movies
  next-arr-lidarr:
    image: ghcr.io/hotio/lidarr:latest
    ports: ["127.0.0.1:23233:8686"]
    environment: { PUID: "1000", PGID: "1000", TZ: UTC }
    volumes:
      - ${NEXT_ARR_DATA_ROOT:?set NEXT_ARR_DATA_ROOT}/lidarr/config:/config
      - ${NEXT_ARR_DATA_ROOT:?set NEXT_ARR_DATA_ROOT}/lidarr/media:/music
