############################
#
#  This compose file is only for development.
#  Do not use this in production.
#
############################

name: development-docker-compose
services:
  redis:
    container_name: redis
    image: redis:8.10.2@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
    ports:
      - "127.0.0.1:6379:6379"

  postgresql:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: homarr
      POSTGRES_USER: homarr
      POSTGRES_DB: homarrdb
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    # if already run PostgreSQL, change port number to use container's service
    #  - 2345:5432

volumes:
  postgresql_data:
