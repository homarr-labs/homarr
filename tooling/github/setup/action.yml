name: "Setup and install"
description: "Common setup steps for Actions"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24.18.0
        cache: "pnpm"

    - shell: bash
      run: pnpm install --frozen-lockfile

    - name: Restore local Turbo artifacts without remote credentials
      if: "!env.ACT && !env.TURBO_TOKEN"
      uses: actions/cache@v5
      with:
        path: .turbo/cache
        key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-
