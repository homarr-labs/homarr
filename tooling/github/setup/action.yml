name: "Setup and install"
description: "Common setup steps for Actions"

inputs:
  next-cache:
    description: Restore Next.js compiler caches for build jobs
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 24.18.0

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2

    - name: Identify the build platform
      shell: bash
      run: |
        node --input-type=module -e '
          import { appendFileSync } from "node:fs";
          const arch = { x64: "amd64", arm64: "arm64" }[process.arch] ?? process.arch;
          let libc = "musl";
          if (process.report.getReport().header.glibcVersionRuntime) libc = "glibc";
          appendFileSync(process.env.GITHUB_ENV, `TURBO_PLATFORM=${process.platform}/${arch}/${libc}/node-${process.versions.node}\n`);
        '

    - name: Restore Bun dependency cache
      if: "!env.ACT"
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-1.4.2-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json', 'patches/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-bun-1.4.2-

    - shell: bash
      run: bun install --frozen-lockfile --concurrent-scripts=1

    - name: Restore local Turbo artifacts
      if: "!env.ACT"
      uses: actions/cache@v5
      with:
        path: .turbo/cache
        key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.job }}-${{ hashFiles('bun.lock') }}-

    - name: Restore Next.js compiler caches
      if: inputs.next-cache == 'true' && !env.ACT
      uses: actions/cache@v5
      with:
        path: |
          apps/nextjs/.next/cache
          apps/docs/.next/cache
        key: ${{ env.TURBO_PLATFORM }}-next-${{ hashFiles('bun.lock') }}-${{ github.sha }}
        restore-keys: |
          ${{ env.TURBO_PLATFORM }}-next-${{ hashFiles('bun.lock') }}-
