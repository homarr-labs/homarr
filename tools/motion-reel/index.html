html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0b0b0f;color:#fff;

.abs{position:absolute;left:0;top:0}

.mono{font-family:JB,monospace}
.full{position:absolute;left:0;top:0;width:1920px;height:1080px}
.center{display:flex;align-items:center;justify-content:center}
.mask{overflow:hidden;white-space:nowrap}
.nowrap{white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-family:JB,monospace;font-weight:600;letter-spacing:.18em;border:2px solid currentColor;border-radius:999px;white-space:nowrap}
.wcard{position:absolute;background:linear-gradient(180deg,#1d1d23,#17171b);border:1px solid rgba(255,255,255,.075);border-radius:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 12px 32px rgba(0,0,0,.35);overflow:hidden;color:#ececf1;box-sizing:border-box}
.wtitle{position:absolute;left:18px;top:14px;display:flex;align-items:center;gap:9px;font-weight:650;font-size:17px;color:#cfcfd6}
.bar{position:absolute;height:8px;border-radius:4px;background:#27272e;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#e03131,#ff8787)}
.tile{position:absolute;border-radius:28px;background:linear-gradient(180deg,#19191e,#131317);border:1px solid rgba(255,255,255,.08);overflow:hidden;box-sizing:border-box;
