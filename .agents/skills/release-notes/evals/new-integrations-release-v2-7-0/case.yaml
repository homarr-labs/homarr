schema_version: "1.1"
name: new-integrations-release-v2-7-0
expected_outcome: |
  notes.md holds user-facing release notes for Homarr v2.7.0 built only from the merged PRs between v2.6.0 and v2.7.0:
  a "# Homarr v2.7.0: ..." title naming the main change in plain words (not a slogan), a one or two sentence summary,
  2 to 4 highlights, New / Improved / Fixed bullets that start with a bold lead and end with
  "by @login in [#N](url)", no bot, chore, ci, docs or test noise, no emojis,
  a table of the new integrations and widgets (Sportarr, Thingport and the Thingport widgets) with an icon column,
  the generated art or the {{RELEASE_ART}} placeholder directly above that table,
  and the Full Changelog compare link as the last line.
